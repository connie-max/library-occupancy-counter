<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>History</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    nav a { margin-right: 15px; }
    table { border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #999; padding: 8px 16px; text-align: left; }
    th { background: #eee; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Live</a>
    <a href="/history">History</a>
    <a href="/logout">Logout</a>
  </nav>

  <h1>History</h1>
  <table>
    <tr><th>Time</th><th>Seat</th><th>Event</th></tr>
    {% for row in rows %}
      <tr><td>{{ row.time }}</td><td>{{ row.seat }}</td><td>{{ row.event }}</td></tr>
    {% endfor %}
  </table>
</body>
</html>
