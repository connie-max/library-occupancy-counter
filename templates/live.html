<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Live Seat Map</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    nav a { margin-right: 15px; }
    .banner { background: #c0392b; color: white; font-size: 40px; font-weight: bold;
              text-align: center; padding: 20px; margin: 20px 0; border-radius: 8px; }
    .counts { margin: 15px 0; font-size: 18px; }
    .grid { display: flex; flex-wrap: wrap; gap: 10px; max-width: 450px; }
    .seat { width: 70px; height: 70px; display: flex; align-items: center;
            justify-content: center; color: white; font-weight: bold; border-radius: 8px; }
    .taken { background: #e74c3c; }
    .vacant { background: #2ecc71; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Live</a>
    <a href="/history">History</a>
    <a href="/logout">Logout</a>
  </nav>

    <h1>Live Seat Map</h1>

  {% if total > 0 and vacant == 0 %}
    <div class="banner">LIBRARY FULL</div>
  {% endif %}

  {% if total == 0 %}
    <p>No seat data yet.</p>
  {% endif %}

  <div class="counts">
    Total: <b>{{ total }}</b> |
    Taken: <b>{{ taken }}</b> |
    Vacant: <b>{{ vacant }}</b>
  </div>

  <div class="grid">
    {% for seat, is_taken in seats.items() %}
      <div class="seat {{ 'taken' if is_taken else 'vacant' }}">{{ seat }}</div>
    {% endfor %}
  </div>
</body>
</html>
